<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Ceci n'est pas une page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }
        .gallery-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
        }
        .canvas-frame {
            background: #f5f0e6;
            color: #1c1917;
            border: 10px solid #78350f;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.25), 0 10px 25px rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            padding: 2rem 1.5rem;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }
        .canvas-frame:hover {
            transform: translateY(-4px) rotate(-0.5deg);
        }
        .error-num {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            color: #1c1917;
            margin-bottom: 0.75rem;
        }
        .caption-script {
            font-family: "Georgia", "Times New Roman", serif;
            font-style: italic;
            font-size: 1.35rem;
            color: #44403c;
            letter-spacing: 0.02em;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #f1f5f9;
        }
        p {
            color: #94a3b8;
            font-size: 0.98rem;
            line-height: 1.65;
            margin-bottom: 2rem;
        }
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 0.8rem 1.75rem;
            border-radius: 10px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .status-pill {
            display: inline-block;
            font-family: monospace;
            font-size: 0.8rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <main class="gallery-card">
        <span class="status-pill">HTTP 404 • NOT FOUND</span>
        <div class="canvas-frame">
            <div class="error-num">404</div>
            <div class="caption-script">Ceci n'est pas une page</div>
        </div>
        <h1>The Treachery of Broken Links</h1>
        <p>
            You have wandered into an empty gallery room. The route you requested either moved,
            never existed, or is merely an illusion on this server.
        </p>
        <div class="actions">
            <a href="/" class="btn-primary">Return to Homepage</a>
        </div>
    </main>
</body>
</html>
